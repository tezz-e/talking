<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Talking Copilot</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #0f0f17;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .logo {
      font-size: 18px;
    }
    .title {
      font-weight: 700;
      font-size: 15px;
      color: #fff;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 12px;
      color: #a1a1aa;
    }
    .badge {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge.online {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }
    .badge.offline {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }
    .shortcuts-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
    }
    .kbd {
      background: rgba(255, 255, 255, 0.12);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      color: #fff;
      font-family: monospace;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      padding: 8px;
      margin-top: 12px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
      transition: filter 0.15s;
    }
    .btn:hover {
      filter: brightness(1.1);
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">⚡</span>
    <span class="title">Talking Copilot</span>
  </div>

  <div class="status-row">
    <span>Backend Status</span>
    <span class="badge" id="statusBadge">Checking...</span>
  </div>

  <div class="shortcuts-card">
    <div style="font-weight: 600; margin-bottom: 6px; color: #e4e4e7;">Supported Sites</div>
    <div style="font-size: 12px; color: #a1a1aa; margin-bottom: 8px;">
      • WhatsApp Web (web.whatsapp.com)<br/>
      • Instagram Direct (instagram.com/direct)
    </div>
    <div style="font-size: 12px; color: #a1a1aa;">
      Press <span class="kbd">Alt+D</span> anywhere in chat to trigger instant AI drafts.
    </div>
  </div>

  <a class="btn" href="http://localhost:8000" target="_blank">Open Talking Dashboard ↗</a>

  <script src="popup.js"></script>
</body>
</html>
