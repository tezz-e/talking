<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Talking Copilot</title>
  <style>
    :root {
      --tk-bg: #13120D;
      --tk-surface: #1C1A14;
      --tk-ink: #ECE7DA;
      --tk-text-muted: rgba(236, 231, 218, 0.65);
      --tk-hairline: rgba(236, 231, 218, 0.15);
      --tk-accent: #FF4F1F;
    }
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: var(--tk-bg);
      color: var(--tk-ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      font-size: 13px;
      line-height: 1.5;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--tk-hairline);
    }
    .logo-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--tk-accent);
    }
    .title {
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--tk-ink);
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--tk-text-muted);
    }
    .badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .badge.online {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .badge.offline {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .shortcuts-card {
      background: var(--tk-surface);
      border: 1px solid var(--tk-hairline);
      border-radius: 4px;
      padding: 10px;
      margin-top: 10px;
    }
    .card-title {
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 6px;
      color: var(--tk-ink);
    }
    .kbd {
      background: rgba(236, 231, 218, 0.12);
      border: 1px solid var(--tk-hairline);
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 10px;
      color: var(--tk-ink);
      font-family: monospace;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      padding: 9px;
      margin-top: 12px;
      background: var(--tk-accent);
      color: #FFFFFF;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: filter 0.15s, opacity 0.15s;
    }
    .btn:hover {
      filter: brightness(1.1);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-group">
      <span class="logo-dot"></span>
      <span class="title">Talking Copilot</span>
    </div>
  </div>

  <div class="status-row">
    <span>Backend Status</span>
    <span class="badge" id="statusBadge">Checking...</span>
  </div>

  <div class="shortcuts-card">
    <div class="card-title">Supported Platforms</div>
    <div style="font-size: 12px; color: var(--tk-text-muted); margin-bottom: 8px;">
      • WhatsApp Web (web.whatsapp.com)<br/>
      • Instagram Direct (instagram.com/direct)
    </div>
    <div style="font-size: 12px; color: var(--tk-text-muted);">
      Press <span class="kbd">Alt+D</span> in any chat to trigger instant Proof Desk draft burst.
    </div>
  </div>

  <a class="btn" href="http://localhost:8000" target="_blank">Open Proof Desk Dashboard ↗</a>

  <script src="popup.js"></script>
</body>
</html>
